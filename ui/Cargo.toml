[package]
name = "wireshark-ui"
version = "0.1.0"
edition = "2024"
description = "Leptos UI of wireshark-rs, built to wasm and embedded in the shell"
# Embedded in the shell binary, never published to crates.io.
publish = false

[lints]
workspace = true

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["CustomEvent", "DomRect", "Element", "HtmlDialogElement", "HtmlElement"] }
